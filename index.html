<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elsad Pro Smart Calc</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .calculator {
            background: #ffffff;
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            width: 90%;
            max-width: 380px;
        }

        #display {
            width: 100%;
            height: 70px;
            background: #f8f9fa;
            border: none;
            border-radius: 15px;
            color: #333;
            text-align: right;
            padding: 15px;
            font-size: 32px;
            margin-bottom: 15px;
            outline: none;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        /* Elmi funksiyalar bölməsi - başlanğıcda gizlidir */
        #scientific-keys {
            display: none;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px dashed #ddd;
        }

        button {
            height: 60px;
            border-radius: 15px;
            border: none;
            background: #fff;
            color: #444;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.03);
            transition: 0.2s;
        }

        button:hover { background: #f1f3f5; }

        .operator { color: #3498db; background: #f0f7ff; }
        
        .equal {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
            grid-column: span 2;
        }

        .clear {
            background: #fff5f5;
            color: #ff4757;
            grid-column: span 2;
        }

        .adv-btn {
            background: #34495e;
            color: white;
            grid-column: span 4;
            height: 45px;
            margin-bottom: 10px;
            font-size: 14px;
            text-transform: uppercase;
        }

        .sci-btn {
            background: #eef2f3;
            color: #555;
            font-size: 14px;
            height: 50px;
        }

        .footer {
            margin-top: 15px;
            text-align: center;
            font-size: 11px;
            color: #aaa;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" id="display" disabled placeholder="0">
        
        <button class="adv-btn" onclick="toggleScientific()">Advanced Mode</button>

        <div id="scientific-keys">
            <button class="sci-btn" onclick="scientific('Math.sin')">sin</button>
            <button class="sci-btn" onclick="scientific('Math.cos')">cos</button>
            <button class="sci-btn" onclick="scientific('Math.tan')">tan</button>
            <button class="sci-btn" onclick="scientific('Math.sqrt')">√</button>
            <button class="sci-btn" onclick="scientific('Math.log10')">log</button>
            <button class="sci-btn" onclick="scientific('Math.PI')">π</button>
            <button class="sci-btn" onclick="appendToDisplay('**')">^</button>
            <button class="sci-btn" onclick="clearDisplay()">AC</button>
        </div>

        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">CLEAR</button>
            <button class="operator" onclick="appendToDisplay('/')">÷</button>
            <button class="operator" onclick="appendToDisplay('*')">×</button>
            
            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button class="operator" onclick="appendToDisplay('-')">-</button>
            
            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button class="operator" onclick="appendToDisplay('+')">+</button>
            
            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button class="operator" onclick="calculate()">=</button>
            
            <button onclick="appendToDisplay('0')">0</button>
            <button onclick="appendToDisplay('.')">.</button>
            <button class="equal" onclick="calculate()">TOTAL</button>
        </div>
        <div class="footer">SMART CALCULATOR BY ELSAD</div>
    </div>

    <script>
        const display = document.getElementById('display');
        const sciKeys = document.getElementById('scientific-keys');

        function appendToDisplay(input) {
            if (display.value === "Error") display.value = "";
            display.value += input;
        }

        function clearDisplay() { display.value = ""; }

        function calculate() {
            try {
                let result = eval(display.value);
                display.value = Number.isInteger(result) ? result : result.toFixed(4);
            } catch { display.value = "Error"; }
        }

        // Elmi rejimi gizlə/göstər
        function toggleScientific() {
            if (sciKeys.style.display === "grid") {
                sciKeys.style.display = "none";
            } else {
                sciKeys.style.display = "grid";
            }
        }

        // Riyazi funksiyalar (sin, cos və s.)
        function scientific(func) {
            try {
                if (func === 'Math.PI') {
                    display.value += Math.PI.toFixed(4);
                } else {
                    let val = eval(display.value);
                    display.value = eval(func + "(" + val + ")").toFixed(4);
                }
            } catch { display.value = "Error"; }
        }

        // Klaviaturada rəqəmləri yazmaq üçün
        document.addEventListener('keydown', (e) => {
            if(/[0-9\/\*\-\.\+]/.test(e.key)) appendToDisplay(e.key);
            if(e.key === 'Enter') calculate();
            if(e.key === 'Escape') clearDisplay();
        });
    </script>
</body>
</html>
