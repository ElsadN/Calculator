<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elsad's Light & Smart Calc</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            /* Çox yumşaq və göz yormayan açıq gradient */
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .calculator {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid #ffffff;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
            width: 95%;
            max-width: 380px;
            transition: transform 0.3s ease;
        }

        #display {
            width: 100%;
            height: 80px;
            background: #ffffff;
            border: 1px solid #e1e8ed;
            border-radius: 15px;
            color: #2c3e50;
            text-align: right;
            padding: 20px;
            font-size: 34px;
            margin-bottom: 25px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
            outline: none;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        button {
            height: 65px;
            border-radius: 15px;
            border: none;
            background: #ffffff;
            color: #444;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.04);
            transition: all 0.2s ease;
        }

        button:hover {
            background: #f8f9fa;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.08);
        }

        button:active {
            transform: translateY(0);
        }

        .operator {
            background: #f1f3f5;
            color: #3498db;
            font-weight: bold;
        }

        .equal {
            background: #3498db;
            color: white;
            grid-column: span 2;
        }

        .equal:hover {
            background: #2980b9;
            color: white;
        }

        .clear {
            background: #fff5f5;
            color: #ff6b6b;
            grid-column: span 2;
        }

        .clear:hover {
            background: #ffe3e3;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            font-size: 12px;
            color: #95a5a6;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Klaviaturada basılan düymənin vizual effekti */
        .key-active {
            background: #3498db !important;
            color: white !important;
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" id="display" disabled placeholder="0">
        <div class="buttons">
            <button class="clear" id="key-Escape" onclick="clearDisplay()">CLEAR</button>
            <button class="operator" id="key-/" onclick="appendToDisplay('/')">÷</button>
            <button class="operator" id="key-*" onclick="appendToDisplay('*')">×</button>
            
            <button id="key-7" onclick="appendToDisplay('7')">7</button>
            <button id="key-8" onclick="appendToDisplay('8')">8</button>
            <button id="key-9" onclick="appendToDisplay('9')">9</button>
            <button class="operator" id="key--" onclick="appendToDisplay('-')">−</button>
            
            <button id="key-4" onclick="appendToDisplay('4')">4</button>
            <button id="key-5" onclick="appendToDisplay('5')">5</button>
            <button id="key-6" onclick="appendToDisplay('6')">6</button>
            <button class="operator" id="key-+" onclick="appendToDisplay('+')">+</button>
            
            <button id="key-1" onclick="appendToDisplay('1')">1</button>
            <button id="key-2" onclick="appendToDisplay('2')">2</button>
            <button id="key-3" onclick="appendToDisplay('3')">3</button>
            <button class="operator" id="key-Enter" onclick="calculate()">=</button>
            
            <button id="key-0" onclick="appendToDisplay('0')">0</button>
            <button id="key-." onclick="appendToDisplay('.')">.</button>
            <button class="equal" id="key-equal" onclick="calculate()">TOTAL</button>
        </div>
        <div class="footer">Smart Calculator by Elsad</div>
    </div>

    <script>
        const display = document.getElementById('display');

        function appendToDisplay(input) {
            if (display.value === "Xəta") display.value = "";
            display.value += input;
        }

        function clearDisplay() {
            display.value = "";
        }

        function calculate() {
            try {
                let result = eval(display.value);
                display.value = Number.isInteger(result) ? result : result.toFixed(2);
            } catch {
                display.value = "Xəta";
            }
        }

        // KLAVİATURA İDARƏETMƏSİ
        document.addEventListener('keydown', (event) => {
            const key = event.key;
            
            // Rəqəmlər və riyazi işarələr
            if (/[0-9\/\*\-\.\+]/.test(key)) {
                appendToDisplay(key);
                highlightButton(key);
            } 
            // Enter düyməsi (Hesablama)
            else if (key === 'Enter') {
                event.preventDefault(); // Səhifənin yenilənməsinin qarşısını alır
                calculate();
                highlightButton('Enter');
                highlightButton('equal');
            } 
            // Escape (Təmizləmə)
            else if (key === 'Escape') {
                clearDisplay();
                highlightButton('Escape');
            }
            // Backspace (Sonuncunu sil)
            else if (key === 'Backspace') {
                display.value = display.value.slice(0, -1);
            }
        });

        // Düyməyə basıldıqda animasiya göstərir
        function highlightButton(key) {
            const btn = document.getElementById('key-' + key);
            if (btn) {
                btn.classList.add('key-active');
                setTimeout(() => btn.classList.remove('key-active'), 150);
            }
        }
    </script>
</body>
</html>
