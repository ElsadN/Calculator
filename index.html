<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elsad's Bright & Smart Calc</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            /* Daha işıqlı və enerjili arxa plan */
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .calculator {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid white;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 380px;
            position: relative;
        }

        #display {
            width: 100%;
            height: 70px;
            background: white;
            border: 2px solid #3a7bd5;
            border-radius: 15px;
            color: #333;
            text-align: right;
            padding: 15px;
            font-size: 32px;
            margin-bottom: 20px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
            outline: none;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            height: 65px;
            border-radius: 15px;
            border: none;
            background: white;
            color: #333;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: all 0.2s;
        }

        button:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        button:active {
            transform: translateY(0);
        }

        .operator {
            background: #f8f9fa;
            color: #3a7bd5;
        }

        .equal {
            background: linear-gradient(45deg, #3a7bd5, #00d2ff);
            color: white;
            grid-column: span 2;
        }

        .clear {
            background: #ffeded;
            color: #ff4757;
            grid-column: span 2;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #777;
            letter-spacing: 1px;
        }

        /* Klaviatura aktiv olanda düymə parıltısı üçün klass */
        .key-active {
            background: #3a7bd5 !important;
            color: white !important;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" id="display" disabled placeholder="0">
        <div class="buttons">
            <button class="clear" id="key-Escape" onclick="clearDisplay()">CLEAR (Esc)</button>
            <button class="operator" id="key-/" onclick="appendToDisplay('/')">÷</button>
            <button class="operator" id="key-*" onclick="appendToDisplay('*')">×</button>
            
            <button id="key-7" onclick="appendToDisplay('7')">7</button>
            <button id="key-8" onclick="appendToDisplay('8')">8</button>
            <button id="key-9" onclick="appendToDisplay('9')">9</button>
            <button class="operator" id="key--" onclick="appendToDisplay('-')">-</button>
            
            <button id="key-4" onclick="appendToDisplay('4')">4</button>
            <button id="key-5" onclick="appendToDisplay('5')">5</button>
            <button id="key-6" onclick="appendToDisplay('6')">6</button>
            <button class="operator" id="key-+" onclick="appendToDisplay('+')">+</button>
            
            <button id="key-1" onclick="appendToDisplay('1')">1</button>
            <button id="key-2" onclick="appendToDisplay('2')">2</button>
            <button id="key-3" onclick="appendToDisplay('3')">3</button>
            <button class="operator" id="key-Enter" onclick="calculate()">=</button>
            
            <button id="key-0" onclick="appendToDisplay('0')">0</button>
            <button id="key-." onclick="appendToDisplay('.')">.</button>
            <button class="equal" id="key-Enter" onclick="calculate()">TOTAL (Enter)</button>
        </div>
        <div class="footer">SMART CALCULATOR BY ELSAD</div>
    </div>

    <script>
        const display = document.getElementById('display');

        function appendToDisplay(input) {
            if (display.value === "Error") display.value = "";
            display.value += input;
        }

        function clearDisplay() {
            display.value = "";
        }

        function calculate() {
            try {
                let result = eval(display.value);
                display.value = Number.isInteger(result) ? result : result.toFixed(2);
            } catch {
                display.value = "Error";
            }
        }

        // KLAVİATURA DƏSTƏYİ
        document.addEventListener('keydown', (event) => {
            const key = event.key;
            
            // Rəqəmlər və operatorlar
            if (/[0-9\/\*\-\.\+]/.test(key)) {
                appendToDisplay(key);
                animateButton(key);
            } 
            // Enter düyməsi
            else if (key === 'Enter') {
                calculate();
                animateButton('Enter');
            } 
            // Escape və ya Backspace (təmizləmək üçün)
            else if (key === 'Escape' || key === 'Delete') {
                clearDisplay();
                animateButton('Escape');
            }
            else if (key === 'Backspace') {
                display.value = display.value.slice(0, -1);
            }
        });

        // Düyməyə basanda vizual effekt
        function animateButton(key) {
            const btn = document.getElementById('key-' + key);
            if (btn) {
                btn.classList.add('key-active');
                setTimeout(() => btn.classList.remove('key-active'), 100);
            }
        }
    </script>
</body>
</html>
